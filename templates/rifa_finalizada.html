<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Finalizada - {{ rifa.titulo }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cerrada-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            padding: 50px 30px;
            text-align: center;
            border-top: 8px solid #ef4444;
            margin: 20px;
        }
        .icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 20px;
        }
        h1 {
            color: #374151;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="cerrada-container">
        <div class="icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Rifa Finalizada</h1>
        <p>Lo sentimos, esta rifa (<strong>{{ rifa.titulo }}</strong>) ya ha concluido y el enlace ya no es válido para recibir nuevos participantes.</p>
        <p>¡Gracias por tu interés!</p>
    </div>
</body>
</html>
